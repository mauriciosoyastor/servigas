# Stack piloto mostrador Servigas (opción C): Postgres + Odoo 19 + Astro BFF.
#
# Uso (desde esta carpeta):
#   docker compose --env-file .env up -d --build
# Ver docs/proyecto/docker-piloto-mostrador.md

name: servigas-mostrador

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - servigas-db-data:/var/lib/postgresql/data
    # Solo para debug local; en el mostrador podés comentar ports.
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    ports:
      - "${ODOO_HOST_PORT:-8069}:8069"
    volumes:
      - servigas-odoo-data:/var/lib/odoo
      - ../../custom_addons:/mnt/extra-addons:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: production
      ASTRO_TOOLBAR: "0"
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-servigas}
      BFF_SESSION_STORE: file
      BFF_SESSION_DIR: /app/.data/bff-sessions
    ports:
      - "${WEB_HOST_PORT:-4322}:4321"
    volumes:
      - servigas-web-sessions:/app/.data/bff-sessions

volumes:
  servigas-db-data:
  servigas-odoo-data:
  servigas-web-sessions:
